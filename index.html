g. PDA parenting requires this: the same response that worked yesterday may fail today. Wisdom, not script.", "science": "Research on PDA parenting flexibility (Gore-Langton; PDA Society guidance) consistently emphasises that effective PDA approaches require constant calibration \u2014 reading the child's current state, demand load, and context \u2014 rather than consistent technique application.", "action": "Reflect on a recent interaction that didn't go as planned despite using a 'right' approach. What was the specific context you missed? What would phronesis \u2014 responsive wisdom \u2014 have perceived and done differently?"}, {"id": "pd52", "title": "The Confucian Virtue of Patience", "hook": "The one who can wait longest wins \u2014 always.", "core": "Confucian ethics places patience \u2014 ren, endurance \u2014 as one of the foundational virtues precisely because it is hardest. In PDA parenting, the parent who can wait \u2014 for regulation, for readiness, for the right moment \u2014 consistently produces better outcomes than the parent who acts from urgency.", "science": "Research on parental wait time and PDA outcomes (Eaton; Sherwin & O'Brien) shows that parents who can tolerate extended periods without demanding response or resolution produce significantly lower meltdown frequency and longer periods of cooperative functioning.", "action": "Practice one deliberate act of patience today: wait longer than feels comfortable before speaking, responding, or acting. Notice what emerges in the space you create."}, {"id": "pd53", "title": "The Narrative Therapy Frame", "hook": "The problem is not the child \u2014 the problem is the problem.", "core": "Narrative therapist Michael White's foundational distinction: the person is not the problem; the problem is the problem. In PDA parenting, your child is not the problem; the anxiety-demand dynamic is the problem. This linguistic shift is not semantic \u2014 it changes everything about how you engage.", "science": "Narrative therapy research (White & Epston; Madigan) shows that externalising the problem \u2014 treating it as a thing separate from the person \u2014 consistently reduces defensiveness, shame, and identification with problem identity, and opens creative problem-solving.", "action": "Practice the externalising language with your child once today: not 'you're being difficult' but 'the anxiety is getting in the way again' or 'the demand-brain is firing'. Personify and externalise the challenge."}, {"id": "pd54", "title": "Simone Weil and the Attention of Love", "hook": "To truly pay attention to a child is to love them.", "core": "Simone Weil's definition of love as complete, non-judgmental attention is perhaps the most radical parenting instruction available. A PDA child who is truly seen \u2014 in all their complexity, difficulty, and beauty \u2014 without being managed or fixed, receives something that changes them.", "science": "Research on parental attunement and child neurodevelopment (Schore; Siegel) shows that the experience of being truly seen \u2014 the child's brain registering that another brain is tracking and responding to theirs \u2014 is the primary mechanism of right-hemisphere development and emotional regulation.", "action": "Give your child five minutes of Weil's attention today: complete, non-judgemental, non-fixing, non-directing. Just see them. Let what you see be enough."}, {"id": "pd55", "title": "The Long Patience of Geology", "hook": "Mountains are made of a billion small deposits.", "core": "Geological time teaches a wisdom that modern urgency refuses: profound change happens through the accumulation of infinitesimal increments over vast time. PDA progress is geological. A family is not transformed in a month. Trust is not built in a week. The deposits are real even when invisible.", "science": "Research on PDA outcomes over time (PDA Society longitudinal data; case studies) consistently shows that families who maintain low-demand, high-connection approaches over months and years \u2014 even through apparent plateaus and regressions \u2014 achieve outcomes that short-term approaches cannot produce.", "action": "Name three small deposits you have made in your relationship with your PDA child this month. They may be tiny. They are real. They are adding up to something."}, {"id": "pd56", "title": "The Quantum Uncertainty of Behaviour", "hook": "You can't predict a PDA child's behaviour \u2014 so stop trying and start observing.", "core": "In quantum mechanics, the Heisenberg uncertainty principle holds that the more precisely you know one property of a particle, the less precisely you can know another. PDA behaviour has a similar quality: the more tightly you try to predict and control it, the more unpredictable and uncontrollable it becomes. Release the prediction. Embrace the observation.", "science": "Research on PDA and predictability (O'Nions; Gore-Langton) shows that PDA children are more responsive to parents who remain curious and responsive rather than those who approach with fixed expectations \u2014 confirming that the observational stance outperforms the predictive one.", "action": "Spend one day in pure observation mode with your child: no predictions, no expectations, no scripts. Just watch, respond, and be curious about what you see. Notice how differently it feels."}, {"id": "pd57", "title": "The Hermeneutic Circle of PDA Understanding", "hook": "You understand the part by understanding the whole, and the whole by understanding the parts.", "core": "The hermeneutic circle \u2014 the philosopher's tool for understanding texts \u2014 applies to understanding a PDA child. Each behaviour makes more sense when seen in the context of the whole child; the whole child becomes clearer through each behaviour. Understanding deepens in spiral, not linear fashion.", "science": "Idiographic clinical approaches (Allport; Lamiell) emphasise that understanding a specific individual requires exactly this hermeneutic movement between the particular and the general \u2014 building a richer, more accurate model through continued observation and revision.", "action": "Take one recent confusing behaviour and ask: what does this tell me about my child as a whole? Then ask: knowing my child as a whole, what does this behaviour most likely mean? Move between the levels."}, {"id": "pd58", "title": "The Prophetic Parent", "hook": "You see something in your child that the world has missed.", "core": "The prophetic tradition sees what others cannot see \u2014 often because they are outside the dominant frame. As a PDA parent, you are developing a knowledge of your specific child that no professional, teacher, or family member has. This is expertise. Claim it. Speak from it.", "science": "Research on parent expertise in neurodivergent contexts (Rutherford et al.; Kasari) consistently shows that parents who have developed deep observational knowledge of their child are more accurate than professionals in predicting responses, identifying triggers, and evaluating intervention effectiveness.", "action": "Write three things you know about your child that no professional or teacher currently understands. This is expertise. How could you communicate it more effectively to those who need to hear it?"}, {"id": "pd59", "title": "The Ethics of Rest", "hook": "Your sustainability is not optional \u2014 it is your child's resource.", "core": "There is a profound ethical dimension to parental self-care: you are a resource, and exhausted resources run out. The PDA parent who does not rest, who does not repair, who does not seek support, is depleting the very thing their child most needs: a regulated, available, compassionate adult.", "science": "Research on parental burnout in neurodivergent families (Mikolajczak et al.; Roskam et al.) shows specific PDA and autism parent burnout patterns associated with significantly reduced parenting quality, increased harsh responses, and diminished child wellbeing \u2014 making rest a clinical priority, not a luxury.", "action": "Identify one concrete, specific act of self-restoration you will do this week \u2014 not as reward but as clinical necessity. Schedule it. Protect it. Do not apologise for it."}, {"id": "pd60", "title": "The Covenant with the Difficult Child", "hook": "Your love for this child is the most radical thing you do.", "core": "The covenantal tradition \u2014 unconditional commitment not contingent on performance \u2014 is the frame the PDA relationship requires. Not 'I love you when you're manageable' but 'I am here, always, regardless'. This is not sentiment. It is a neurological intervention. The child who knows this is held differently.", "science": "Research on unconditional parental acceptance in high-need children (Sroufe; Kobak) shows that the child's representation of parental commitment \u2014 their internal working model of whether the parent will remain present through difficulty \u2014 is the strongest predictor of emotional regulation and behavioural outcomes.", "action": "Find a way to communicate to your child today, in a moment of relative calm, that your love and presence are not contingent on their behaviour. Find the words that are yours. Let them be simple and true."}]}, {"id": "quantum", "name": "The Better Quantum Track", "emoji": "\u269b\ufe0f", "color": "#1A3A5C", "accent": "#38BDF8", "description": "Navigate life trajectories deliberately \u2014 not by force, but by steering", "lessons": [{"id": "q1", "title": "The Branch Point Reality", "hook": "Multiple versions of your life are genuinely available right now.", "core": "The quantum metaphor isn't mysticism \u2014 it's a precision tool. From this moment, genuinely different trajectories are available to you. They don't diverge dramatically at the start; they diverge in tiny structural decisions that compound over years. The mechanism isn't willpower or inspiration. It's attention, then decision, then environment.", "science": "Path dependence theory (David, 1985; Arthur) shows how small early choices create 'lock-in' effects \u2014 trajectories that become self-reinforcing. The same mechanism works in personal development: tiny structural shifts early compound into radically different outcomes. Kahneman & Tversky's decision research confirms most high-impact branch points go unrecognised.", "action": "Identify one decision you face in the next 30 days \u2014 however mundane it appears. Ask: which life trajectory does this belong to? The one you're in, or the one you're navigating toward? Name both trajectories clearly."}, {"id": "q2", "title": "Writing the 2031 State", "hook": "Not goals. Specific, sensory, emotional detail.", "core": "A goal is an abstract destination. The 2031 state is a scene \u2014 Tuesday morning, a specific room, a specific feeling, a specific kind of problem you're solving. The more sensory and emotionally specific you make it, the more precisely your brain can reverse-engineer the path. Vagueness is the enemy of navigation.", "science": "Mental simulation research (Taylor & Pham; Oettingen) shows that vivid, specific future-state imagination activates goal-pursuit mechanisms \u2014 but only when combined with obstacle identification (implementation intentions). The scene, not the aspiration, is the functional unit.", "action": "Spend 15 minutes writing the 2031 scene. Not what you'll have achieved \u2014 what Tuesday morning feels like. Where are you? Who is around? What has been resolved? What no longer exists that exists today? Be uncomfortably specific."}, {"id": "q3", "title": "The Five Prerequisites", "hook": "Not actions \u2014 prerequisites. Things that must be true.", "core": "Prerequisites are different from goals and actions. A prerequisite is a structural condition that must exist for the target state to be reachable. 'I have financial security' is a prerequisite. 'I save \u00a3500 per month' is an action. Working at the prerequisite level prevents optimising for things that don't actually gate your trajectory.", "science": "Constraint-based planning (Goldratt's Theory of Constraints) and backward induction in decision theory both show that identifying necessary conditions before sufficient ones dramatically improves strategic clarity \u2014 preventing the common error of optimising non-limiting factors.", "action": "List five structural prerequisites that must be true by 2029 for your 2031 state to be reachable. For each one, ask: is this a genuine structural gate, or is it an action disguised as a prerequisite? Rewrite any that are actions."}, {"id": "q4", "title": "Finding the Primary Constraint", "hook": "Which one, if missing, makes all others irrelevant?", "core": "Goldratt's Theory of Constraints applied to your life: of all the prerequisites, one is the actual bottleneck. When you identify it correctly, something clarifies \u2014 you stop feeling diffuse obligation across multiple fronts and feel a single point of leverage. Everything else becomes either supportive or genuinely secondary.", "science": "Goldratt's TOC research showed that systems \u2014 manufacturing plants, organisations, individual lives \u2014 almost always have a single binding constraint at any given moment. Addressing non-constraints produces local optimisation but no systemic improvement. Only the constraint unlocks system throughput.", "action": "Look at your five prerequisites. Ask of each: if this were the only one missing, would the others compensate? The one where the answer is definitively no \u2014 that is your primary constraint. Name it. Write it at the top of a page. That page is your strategy."}, {"id": "q5", "title": "The Time Audit", "hook": "Not intended time. Actual time. The gap is information, not guilt.", "core": "Most people know their primary constraint. Few spend actual time on it. The time audit isn't a productivity exercise \u2014 it's a diagnostic. The gap between where you intended to spend time and where you actually did is precise information about the structural forces working against your trajectory.", "science": "Time use research (Kahneman's Day Reconstruction Method; Robinson & Godbey) consistently shows a 30-50% gap between recalled and actual time allocation. This isn't failure \u2014 it's the visibility of competing commitments that the current life basin generates automatically.", "action": "Track your time in 30-minute blocks for three days. Don't change anything \u2014 just record. Then calculate: what percentage of waking hours went toward your primary constraint? Not intention. Actual percentage. That number is your current trajectory's default direction."}, {"id": "q6", "title": "Basin Thinking", "hook": "You're not failing \u2014 you're in a basin. Those are different problems.", "core": "An attractor basin in physics is a state a system tends to return to after perturbation. Your current life has a basin \u2014 a set of defaults, habits, relationships, and contexts that continuously pull you back toward the current trajectory. Recognising this removes blame and identifies the real intervention: changing the basin, not fighting it.", "science": "Dynamical systems theory (Strogatz) describes attractor basins as the key unit of analysis for understanding system behaviour. Applied to human behaviour, the basin concept reframes resistance and relapse: they are not failures of willpower but the mechanical pull of existing attractors.", "action": "Identify three specific basin forces operating in your life right now \u2014 things that automatically pull you back to your current trajectory when you try to move. Name them precisely. Not 'I'm busy' \u2014 what specifically is pulling you back, and why does it have that pull?"}, {"id": "q7", "title": "The Structural Commitment", "hook": "A decision, not a habit. Irreversible preferred.", "core": "A structural commitment is one that increases the cost of abandoning the trajectory. It's not a resolution or a habit \u2014 it's a decision that changes your future option space. Signing up for a programme. Telling people publicly. Spending money. The irreversibility is the point: it removes the daily willpower cost of recommitting.", "science": "Commitment device research (Ariely; Thaler & Sunstein) shows that pre-commitment mechanisms \u2014 ones that raise the cost of defection \u2014 are significantly more effective than intention or willpower at producing sustained behaviour change, particularly in high-temptation environments.", "action": "Identify one structural commitment \u2014 not a habit \u2014 that you could make in the next 30 days that would increase the cost of abandoning your trajectory. It doesn't have to be huge. It has to be real. What would you need to do, spend, or say publicly?"}, {"id": "q8", "title": "The Subtraction Move", "hook": "What belongs to the wrong trajectory?", "core": "Every current-basin activity you subtract creates space \u2014 attentional, temporal, energetic \u2014 for target-basin activity. The subtraction doesn't have to be dramatic. The key question is not 'is this good?' but 'does this belong to the trajectory I'm on or the one I'm moving toward?' Some good things belong to the wrong trajectory.", "science": "Opportunity cost theory in economics and cognitive load theory in psychology both converge: every commitment you hold occupies finite resources regardless of whether it's actively demanding them. Subtraction is the complement of addition and often the higher-leverage move.", "action": "Name one activity, obligation, or identity that belongs to your current life basin rather than your target one. You don't need to eliminate it today. Just name it honestly and decide: is this a keeper or a candidate for subtraction? If candidate \u2014 what's one step toward removing it?"}, {"id": "q9", "title": "Target-Normal Environments", "hook": "Find where what you're building is unremarkable.", "core": "The most powerful environmental intervention is finding contexts where your target state is normal \u2014 where people around you are already living the trajectory you're building toward. In these environments, your ambitions require no justification, your habits require less willpower, and your identity begins to recalibrate.", "science": "Social norms research (Cialdini; Christakis & Fowler) shows that behaviour and identity are powerfully shaped by the norms of reference groups. Being in an environment where your target behaviour is the norm reduces the cognitive cost of that behaviour to near zero over time.", "action": "Identify one person, community, or environment where what you're building is already unremarkable \u2014 where your 2031 state is just Tuesday morning for them. How much time are you spending there? What would increasing that time by two hours per week require?"}, {"id": "q10", "title": "The Navigation vs Optimisation Distinction", "hook": "Optimising inside your basin is not the same as leaving it.", "core": "The most seductive trap: becoming excellent at being you right now, rather than navigating toward being a different version of yourself. Getting faster, more efficient, more productive inside the current trajectory feels like progress. But it can be the most elaborate form of staying put.", "science": "Christensen's disruption theory, applied personally: incumbent-you optimises existing capabilities. Navigating you builds new ones in new contexts, often at the cost of short-term performance. The two strategies are genuinely incompatible at the margin \u2014 and most optimisation literature implicitly serves the incumbent.", "action": "Look at the last 30 days of improvement efforts. Were they primarily optimising your current trajectory (making it more efficient, more bearable, more sustainable) or navigating toward a new one (building genuinely new capabilities, contexts, relationships)? Name the ratio honestly."}, {"id": "q11", "title": "Fantasy vs Simulation", "hook": "Vivid fantasising without structural change reduces probability of arrival.", "core": "There's a neurological distinction between fantasy (imagining the achieved outcome and feeling the pleasure of it) and simulation (imagining the process, including obstacles, and planning through them). Fantasy is self-completing \u2014 it provides the emotional reward without the structural work. Simulation is different: it activates goal pursuit.", "science": "Gabriele Oettingen's WOOP research (Wish, Outcome, Obstacle, Plan) demonstrates that positive fantasy alone about desired futures correlates negatively with achievement \u2014 it reduces motivation. Mental contrasting \u2014 adding specific obstacle imagery \u2014 reverses this effect completely.", "action": "Take your 2031 scene. Now add the obstacles: what is the most likely thing that will prevent you from reaching it? Write a specific 'if-then' implementation intention: 'When [obstacle] occurs, I will [specific action].' This converts fantasy to simulation."}, {"id": "q12", "title": "The Foundation Layer", "hook": "Depleted-you makes worse branch-point decisions \u2014 always.", "core": "Sleep deprivation, chronic stress, relationship friction, and financial anxiety all degrade prefrontal cortex function \u2014 precisely the brain region responsible for long-term planning, delayed gratification, and accurate self-assessment. Protecting your foundation is not self-indulgence. It is trajectory infrastructure.", "science": "Walker's sleep research and Baumeister's ego depletion work both show that high-level executive decision-making \u2014 the kind required for trajectory navigation \u2014 degrades systematically under chronic depletion. The branch points you face while depleted are worse-navigated than the same points faced rested.", "action": "Honestly assess your current foundation: sleep, relationship quality, physical state, financial stress level. Which one is most depleted? Name one concrete action \u2014 not a habit, a single action \u2014 that would strengthen the most depleted foundation element this week."}, {"id": "q13", "title": "The Season Awareness", "hook": "Not all seasons are for branch-steering. Some are for holding ground.", "core": "High-stress, high-demand seasons \u2014 new baby, professional crisis, family illness, major transition \u2014 are not the right time for structural change. They are the time for foundation protection and trajectory maintenance. Attempting major navigation moves from a depleted state produces worse decisions and higher cost. The infrastructure you've built is the work. Maintain it.", "science": "Research on decision fatigue and life event stress (Holmes & Rahe Stress Scale; Kahneman) shows that cognitive and emotional resources are finite and context-depleted. Willful strategic inaction during high-stress periods \u2014 protecting current gains rather than pursuing new ones \u2014 is often the highest-yield move.", "action": "Assess your current season honestly. Is this a building season or a maintaining season? If maintaining \u2014 name three specific things you are protecting rather than growing. Give yourself permission to name maintenance as the correct strategy right now."}, {"id": "q14", "title": "Irreversible vs Reversible Decisions", "hook": "Treat irreversible decisions with the gravity they deserve.", "core": "Bezos' two-door framework applied to trajectory navigation: Type 1 decisions (irreversible, high-impact) require deep deliberation and should be deferred from depleted states. Type 2 decisions (reversible, lower-impact) should be made quickly to generate information. Most people treat both as the same \u2014 either over-deliberating on reversibles or under-deliberating on irreversibles.", "science": "Decision theory research (Kahneman's System 1/System 2; Schwartz on the paradox of choice) and Jeff Bezos' operational framework both identify irreversibility as the key variable governing appropriate decision speed and cognitive investment.", "action": "List three decisions currently in your mental queue. For each: is this reversible or irreversible? Does your current level of deliberation match the reversibility? Identify any irreversible decision you're treating as reversible (underdeliberating) right now."}, {"id": "q15", "title": "Identity Recalibration", "hook": "You cannot consistently act like someone you don't believe you are.", "core": "The target trajectory requires a different identity \u2014 not a different version of yourself but a genuinely different self-concept in specific domains. 'I am someone who navigates deliberately' is a different identity from 'I am someone who wants to navigate deliberately'. The gap is not aspiration \u2014 it's a quiet belief about what kind of person you actually are.", "science": "Identity-based behaviour change research (Fogg; Clear's atomic habits framework; Erikson's identity theory) shows that sustainable behaviour change requires identity change at the self-concept level. Behaviour that contradicts self-concept is systematically extinguished regardless of motivation level.", "action": "Write one sentence beginning 'I am someone who...' that belongs to your target trajectory but feels like a slight overreach right now. Not a fantasy \u2014 a genuine slight stretch. Say it out loud three times. Notice the resistance. That resistance is identity lag \u2014 it means you're moving."}, {"id": "q16", "title": "The Visibility Principle", "hook": "What you don't measure, you navigate blindly.", "core": "The trajectory toward your 2031 state has leading indicators \u2014 early, measurable signals that you are moving toward or away from it. These are not the outcomes themselves but the inputs that, over time, produce them. Tracking them weekly creates a feedback loop that keeps navigation from drifting into fantasy.", "science": "Feedback loop research (Bandura on self-monitoring; Powers' control theory) shows that visible, frequent feedback on progress-toward-goal is one of the most robust behaviour change mechanisms available \u2014 stronger than intention, motivation, or commitment alone.", "action": "Name two leading indicators that would tell you, week by week, whether you are on trajectory. Not lagging indicators (outcomes) \u2014 leading indicators (inputs). Start tracking them this week. A number. Not a feeling."}, {"id": "q17", "title": "The Cost of the Current Basin", "hook": "Staying is also a choice \u2014 and it has costs.", "core": "The current trajectory is not free. It has costs: the person you're not becoming, the work you're not doing, the relationships you're not building, the health you're not creating. These costs are invisible because they are absences, not presences. Making them visible is necessary for honest navigation.", "science": "Loss aversion research (Kahneman & Tversky) and the economics of opportunity cost both identify the systematic underweighting of foregone options. The counterfactual cost of inaction is cognitively invisible but economically real \u2014 often larger than the cost of change.", "action": "Write three specific costs of remaining on your current trajectory for five more years. Not dramatic catastrophes \u2014 real, specific absences. What won't exist that you want to exist? Make the counterfactual visible."}, {"id": "q18", "title": "Compounding Information", "hook": "Small moves generate information that large plans cannot.", "core": "The most accurate map of a new territory comes from moving through it, not planning it. Small moves toward your target trajectory generate information \u2014 about what you actually want, what resistance you actually face, what you're actually capable of \u2014 that no amount of planning can produce. The plan is the hypothesis. The move is the experiment.", "science": "Effectuation theory (Sarasvathy) developed from studying expert entrepreneurs shows that effective navigators of uncertainty use 'affordable loss' experimentation rather than expected return maximisation \u2014 taking small moves that generate information rather than large bets that require prediction.", "action": "Identify one small move \u2014 something you could do in the next 48 hours \u2014 that would generate information about your target trajectory. Not a commitment to the trajectory. An experiment within it. What would you learn?"}, {"id": "q19", "title": "The Discomfort Signal", "hook": "Discomfort when crossing to a new basin means you're moving, not that you're wrong.", "core": "Basin-crossing produces specific discomforts: the feeling that you're an impostor in a new context, the grief of leaving behind an old identity, the anxiety of decreased competence in new domains, the social friction of changed priorities. These are not signals that something is wrong. They are the phenomenology of trajectory change.", "science": "Transition theory (Bridges; Schlossberg) and identity disruption research both characterise the discomfort of major life transitions as structurally predictable \u2014 not pathological. The comfort of the current basin is partly attachment to identity; the discomfort of leaving is partly identity grief, not error signal.", "action": "Name one discomfort you're currently experiencing that might be a trajectory-movement signal rather than an error signal. Ask honestly: is this telling me I'm going the wrong way, or telling me I'm actually moving? What's the evidence for each interpretation?"}, {"id": "q20", "title": "The Review Ritual", "hook": "Navigation without review is just drift with better intentions.", "core": "The seven moves are not a one-time exercise. They are a periodic review \u2014 quarterly at minimum \u2014 in which you check: has the 2031 scene changed? Have the prerequisites shifted? Is the primary constraint still the same one? Have I made the structural commitment? Have I subtracted? Have I spent time in target-normal environments? Each question is a navigation check, not a performance review.", "science": "Implementation intention and goal review research (Gollwitzer; Brandst\u00e4tter et al.) shows that periodic explicit review of goal-action plans maintains goal-pursuit momentum and enables timely revision \u2014 significantly outperforming both rigid adherence and absence of structure.", "action": "Schedule a 45-minute quarterly review in your calendar right now. Label it 'Quantum Review \u2014 7 Moves'. The date matters less than the act of scheduling. Recurring. Serious. This is the ritual that keeps navigation from becoming wishful thinking."}]}];

// ── STORAGE ──────────────────────────────────────────────────────────────────
const SK='dt_v5';
function today(){return new Date().toISOString().slice(0,10);}
function loadState(){
  try{const r=localStorage.getItem(SK);if(r)return JSON.parse(r);}catch(e){}
  return{
    done:{},starred:{},
    reflections:{},
    reviews:{},
    streak:{current:0,best:0,lastActiveDate:null},
    settings:{notificationsEnabled:false,notificationTime:'08:00'},
    firstOpen:new Date().toISOString()
  };
}
function saveState(s){try{localStorage.setItem(SK,JSON.stringify(s));}catch(e){}}

// ── STREAK ENGINE ─────────────────────────────────────────────────────────────
function updateStreak(state){
  const t=today();
  const last=state.streak.lastActiveDate;
  if(last===t) return state.streak;
  const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
  const yStr=yesterday.toISOString().slice(0,10);
  let current = last===yStr ? state.streak.current+1 : 1;
  let best = Math.max(current, state.streak.best||0);
  return{current,best,lastActiveDate:t};
}

// ── SPACED REPETITION ─────────────────────────────────────────────────────────
function getDueReviews(state){
  const now=Date.now();
  const intervals=[7,30,90].map(d=>d*86400000);
  const due=[];
  Object.entries(state.done).forEach(([id,ts])=>{
    if(!ts) return;
    const completedAt=typeof ts==='number'?ts:Date.parse(ts);
    const reviews=state.reviews[id]||[];
    const nextInterval=intervals[reviews.length];
    if(nextInterval && now-completedAt>=nextInterval){
      const track=TRACKS.find(t=>t.lessons.some(l=>l.id===id));
      const lesson=track&&track.lessons.find(l=>l.id===id);
      if(track&&lesson) due.push({lesson,track,dueLevel:reviews.length});
    }
  });
  return due;
}

// ── REFLECTION CAPTURE ────────────────────────────────────────────────────────
function ReflectionCapture({lesson,track,onSave,onSkip,existingReflection}){
  const [text,setText]=useState(existingReflection?.text||'');
  const [recording,setRecording]=useState(false);
  const [transcribing,setTranscribing]=useState(false);
  const [error,setError]=useState('');
  const mediaRef=useRef(null);
  const chunksRef=useRef([]);
  const art=TRACK_ART[track.id]||TRACK_ART.conversation;

  async function startRecording(){
    setError('');
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mr=new MediaRecorder(stream,{mimeType:MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/ogg'});
      chunksRef.current=[];
      mr.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data);};
      mr.onstop=async()=>{
        stream.getTracks().forEach(t=>t.stop());
        setRecording(false);
        setTranscribing(true);
        const blob=new Blob(chunksRef.current,{type:mr.mimeType});
        // Convert to base64 and send to Claude for transcription
        const reader=new FileReader();
        reader.onloadend=async()=>{
          try{
            const base64=reader.result.split(',')[1];
            const resp=await fetch('https://api.anthropic.com/v1/messages',{
              method:'POST',headers:{'Content-Type':'application/json'},
              body:JSON.stringify({
                model:'claude-sonnet-4-20250514',max_tokens:500,
                messages:[{role:'user',content:[
                  {type:'document',source:{type:'base64',media_type:mr.mimeType,data:base64}},
                  {type:'text',text:'Please transcribe this audio recording exactly. Return only the transcribed text, nothing else.'}
                ]}]
              })
            });
            const data=await resp.json();
            const transcribed=data.content?.[0]?.text||'';
            setText(prev=>(prev?prev+' ':'')+transcribed);
          }catch(e){setError('Transcription failed — type your reflection instead.');}
          setTranscribing(false);
        };
        reader.readAsDataURL(blob);
      };
      mr.start();
      mediaRef.current=mr;
      setRecording(true);
    }catch(e){setError('Microphone access denied. Type your reflection instead.');}
  }

  function stopRecording(){if(mediaRef.current&&recording)mediaRef.current.stop();}

  return(
    <div className="slide-up" style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.85)',backdropFilter:'blur(8px)',zIndex:200,display:'flex',flexDirection:'column',justifyContent:'flex-end'}}>
      <div style={{background:var_bg,borderRadius:'24px 24px 0 0',padding:'24px 22px 48px',border:'1px solid var(--border2)'}}>
        <div style={{display:'flex',justifyContent:'center',marginBottom:20}}>
          <div style={{width:36,height:3,borderRadius:2,background:'var(--border2)'}}/>
        </div>

        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:20}}>
          <div style={{width:32,height:32,borderRadius:8,background:`${art.glow}20`,border:`1px solid ${art.glow}35`,display:'flex',alignItems:'center',justifyContent:'center',color:art.glow,fontSize:14}}>✍️</div>
          <div>
            <div style={{fontSize:14,fontWeight:600,color:'var(--text1)'}}>Capture Your Reflection</div>
            <div style={{fontSize:12,color:'var(--text3)',marginTop:1}}>{lesson.title}</div>
          </div>
        </div>

        <div style={{fontSize:13,color:'var(--text2)',marginBottom:12,fontStyle:'italic',lineHeight:1.5}}>
          "What will you actually do differently because of this lesson?"
        </div>

        <div style={{position:'relative',marginBottom:12}}>
          <textarea
            value={text}
            onChange={e=>setText(e.target.value)}
            placeholder={transcribing?"Transcribing your voice note...":"Type your reflection, or tap the mic to speak..."}
            disabled={transcribing}
            style={{
              width:'100%',minHeight:90,padding:'12px 14px',
              background:'var(--surface)',border:`1px solid ${text?art.glow+'40':'var(--border2)'}`,
              borderRadius:12,color:'var(--text1)',fontSize:14,lineHeight:1.6,
              transition:'border-color 0.2s',
            }}
          />
          {transcribing&&<div style={{position:'absolute',inset:0,borderRadius:12,background:'rgba(0,0,0,0.5)',display:'flex',alignItems:'center',justifyContent:'center'}}>
            <div style={{fontSize:12,color:art.glow,animation:'pulse 1s infinite'}}>Transcribing...</div>
          </div>}
        </div>

        {error&&<div style={{fontSize:12,color:'#F43F5E',marginBottom:10}}>{error}</div>}

        <div style={{display:'flex',gap:8,marginBottom:16}}>
          <button
            onClick={recording?stopRecording:startRecording}
            style={{
              flex:1,padding:'10px',borderRadius:10,fontSize:13,fontWeight:600,
              background:recording?'#F43F5E20':art.glow+'18',
              border:`1px solid ${recording?'#F43F5E55':art.glow+'40'}`,
              color:recording?'#F43F5E':art.glow,
              display:'flex',alignItems:'center',justifyContent:'center',gap:7,
            }}
          >
            <MicIcon size={15}/>
            {recording?'Stop Recording':'Voice Note'}
            {recording&&<span style={{animation:'pulse 1s infinite',marginLeft:4}}>●</span>}
          </button>
        </div>

        <div style={{display:'flex',gap:8}}>
          <button onClick={onSkip} style={{flex:1,padding:'12px',borderRadius:12,background:'var(--surface)',border:'1px solid var(--border)',color:'var(--text3)',fontSize:13,fontWeight:600}}>Skip</button>
          <button
            onClick={()=>onSave(text)}
            disabled={!text.trim()}
            style={{flex:2,padding:'12px',borderRadius:12,background:text.trim()?art.glow:'var(--surface2)',border:'none',color:text.trim()?'#fff':'var(--text3)',fontSize:13,fontWeight:600,opacity:text.trim()?1:0.5,boxShadow:text.trim()?`0 6px 20px ${art.glow}35`:'none',transition:'all 0.2s'}}
          >Save Reflection</button>
        </div>
      </div>
    </div>
  );
}

// ── TELL ME MORE (Claude API) ─────────────────────────────────────────────────
function TellMeMore({lesson,track,onClose}){
  const [loading,setLoading]=useState(true);
  const [content,setContent]=useState('');
  const [error,setError]=useState('');
  const art=TRACK_ART[track.id]||TRACK_ART.conversation;

  useEffect(()=>{
    async function fetch_more(){
      try{
        const resp=await fetch('https://api.anthropic.com/v1/messages',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({
            model:'claude-sonnet-4-20250514',max_tokens:1000,
            messages:[{role:'user',content:`You are a personal development tutor for Tom — a GP, father, husband, and someone with possible AuDHD who is also parenting a possible PDA child (aged 6-7).

He just completed this lesson:
Title: ${lesson.title}
Core insight: ${lesson.core}
Science: ${lesson.science}

Please provide enhanced learning in exactly this format (use these exact headings):

**GOING DEEPER**
[2-3 sentences expanding the core concept with a new angle or nuance he hasn't encountered yet]

**RELATED CONCEPT**
[Name and explain one closely related concept from psychology, philosophy, or neuroscience that connects to this lesson]

**CHALLENGE QUESTION**
[One genuinely challenging question for him to sit with — something that pushes beyond the lesson into his specific life as a GP, father, husband, or AuDHD person]

**IN YOUR LIFE**
[One very specific application to one of his roles — be precise, not generic]

Keep it illuminating, honest, and intellectually serious. No filler.`}]
          })
        });
        const data=await resp.json();
        setContent(data.content?.[0]?.text||'');
      }catch(e){setError('Unable to load — check your connection.');}
      setLoading(false);
    }
    fetch_more();
  },[lesson.id]);

  function renderContent(text){
    return text.split('\n').map((line,i)=>{
      if(line.startsWith('**')&&line.endsWith('**')){
        return(<div key={i} style={{fontSize:10,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',color:art.glow,marginTop:i>0?18:0,marginBottom:6}}>{line.replace(/\*\*/g,'')}</div>);
      }
      if(line.trim()){
        return(<p key={i} style={{fontSize:14,lineHeight:1.72,color:i%2===0?'var(--text1)':'var(--text2)',marginBottom:4}}>{line}</p>);
      }
      return null;
    });
  }

  return(
    <div className="fade-in" style={{position:'fixed',inset:0,background:'var(--bg)',zIndex:300,display:'flex',flexDirection:'column',overflowY:'auto'}}>
      {/* Header */}
      <div style={{position:'sticky',top:0,background:'var(--bg)',padding:'20px 20px 16px',display:'flex',alignItems:'center',gap:12,borderBottom:'1px solid var(--border)',zIndex:10}}>
        <button onClick={onClose} style={{width:38,height:38,borderRadius:10,background:'var(--surface)',border:'1px solid var(--border2)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text2)'}}><BackIcon size={17}/></button>
        <div>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',color:art.glow,marginBottom:2}}>Tell Me More</div>
          <div style={{fontSize:14,fontWeight:600,color:'var(--text1)'}}>{lesson.title}</div>
        </div>
      </div>

      <div style={{padding:'20px 22px 48px',flex:1}}>
        {loading&&(
          <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:16,padding:'60px 0'}}>
            <div style={{width:40,height:40,borderRadius:'50%',border:`2px solid ${art.glow}30`,borderTop:`2px solid ${art.glow}`,animation:'spin 1s linear infinite'}}/>
            <div style={{fontSize:13,color:'var(--text3)',fontStyle:'italic'}}>Going deeper...</div>
            <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
          </div>
        )}
        {error&&<div style={{fontSize:14,color:'#F43F5E',textAlign:'center',padding:'40px 0'}}>{error}</div>}
        {content&&(
          <div className="fade-in">
            {/* Original lesson summary */}
            <div style={{background:`${art.glow}10`,border:`1px solid ${art.glow}25`,borderRadius:14,padding:'14px 16px',marginBottom:24}}>
              <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.1em',textTransform:'uppercase',color:art.glow,marginBottom:6}}>Original Lesson</div>
              <div style={{fontFamily:'var(--serif)',fontSize:16,color:'var(--text1)',fontStyle:'italic',lineHeight:1.4}}>"{lesson.hook}"</div>
            </div>
            {renderContent(content)}
          </div>
        )}
      </div>
    </div>
  );
}

          {/* Hook + title */}

            <div style={{display:'inline-flex',alignItems:'center',gap:5,background:`${art.glow}15`,border:`1px solid ${art.glow}30`,borderRadius:100,padding:'4px 11px',marginBottom:12}}>

              <span style={{fontSize:9,fontWeight:700,letterSpacing:'0.12em',textTransform:'uppercase',color:art.glow}}>Learning Nugget</span>

          {/* Tabs */}

            {step===1&&<p style={{fontSize:13.5,lineHeight:1.72,color:'var(--text2)'}}>{lesson.science}</p>}
            {step===2&&(revealed

        {/* Mark done */}

      </div>

      {/* Reflection capture overlay */}
      {showReflection&&(
        <ReflectionCapture
          lesson={lesson} track={track}
          existingReflection={existingReflection}
          onSave={(text)=>{onSaveReflection(lesson.id,text);setShowReflection(false);}}
          onSkip={()=>setShowReflection(false)}
        />
      )}
    </div>
  );
}

// ── BROWSE VIEW ───────────────────────────────────────────────────────────────
function BrowseView({track,state,onSelect,onBack}){
  const [filter,setFilter]=useState('all');
  const art=TRACK_ART[track.id]||TRACK_ART.conversation;
  const lessons=useMemo(()=>{
    if(filter==='done') return track.lessons.filter(l=>state.done[l.id]);
    if(filter==='todo') return track.lessons.filter(l=>!state.done[l.id]);
    if(filter==='starred') return track.lessons.filter(l=>state.starred[l.id]);
    return track.lessons;
  },[filter,track,state]);

  const doneCount=track.lessons.filter(l=>state.done[l.id]).length;

  return(
    <div className="fade-in" style={{minHeight:'100vh',background:'var(--bg)'}}>
      {/* Header */}
      <div style={{background:art.bg,paddingBottom:20,position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',inset:0,opacity:0.5}}><TrackIllustration trackId={track.id}/></div>
        <div style={{position:'relative',zIndex:2,padding:'20px 20px 0',display:'flex',alignItems:'center',gap:12}}>
          <button onClick={onBack} style={{width:38,height:38,borderRadius:10,background:'rgba(0,0,0,0.35)',backdropFilter:'blur(10px)',border:'1px solid rgba(255,255,255,0.12)',display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(255,255,255,0.8)'}}><BackIcon size={17}/></button>
          <div style={{flex:1}}>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.35)',letterSpacing:'0.08em',marginBottom:2}}>{track.emoji}</div>
            <div style={{fontFamily:'var(--serif)',fontSize:20,color:'var(--text1)',letterSpacing:'-0.01em'}}>{track.name}</div>
            <div style={{fontSize:11,color:'rgba(255,255,255,0.35)',marginTop:2}}>{doneCount}/{track.lessons.length} complete</div>
          </div>
        </div>

        {/* Progress bar */}
        <div style={{position:'relative',zIndex:2,margin:'14px 20px 0'}}>
          <div style={{height:3,background:'rgba(255,255,255,0.1)',borderRadius:2,overflow:'hidden'}}>
            <div style={{height:'100%',width:`${Math.round((doneCount/track.lessons.length)*100)}%`,background:art.glow,borderRadius:2,transition:'width 0.6s'}}/>
          </div>
        </div>
      </div>

      {/* Filter tabs */}
      <div style={{padding:'14px 20px',display:'flex',gap:6,background:'var(--bg)',borderBottom:'1px solid var(--border)'}}>
        {[['all','All'],['todo','To Do'],['done','Done'],['starred','Starred']].map(([val,label])=>(
          <button key={val} onClick={()=>setFilter(val)} style={{padding:'6px 12px',borderRadius:100,fontSize:11,fontWeight:600,background:filter===val?art.glow+'22':'transparent',border:`1px solid ${filter===val?art.glow+'50':'var(--border)'}`,color:filter===val?art.glow:'var(--text3)',transition:'all 0.2s'}}>{label}</button>
        ))}
      </div>

      {/* Lesson list */}
      <div style={{padding:'12px 20px 40px',display:'flex',flexDirection:'column',gap:8}}>
        {lessons.length===0&&(
          <div style={{textAlign:'center',padding:'40px 0',color:'var(--text3)',fontSize:13,fontStyle:'italic'}}>No lessons in this category</div>
        )}
        {lessons.map((lesson,i)=>{
          const done=!!state.done[lesson.id];
          const starred=!!state.starred[lesson.id];
          const hasReflection=!!state.reflections?.[lesson.id]?.text;
          return(
            <div key={lesson.id} onClick={()=>onSelect(lesson)} className={`fade-up d${Math.min(i+1,8)}`}
              style={{background:'var(--surface)',border:`1px solid ${done?art.glow+'30':'var(--border)'}`,borderRadius:14,padding:'14px 15px',cursor:'pointer',position:'relative',overflow:'hidden'}}>
              {done&&<div style={{position:'absolute',top:0,left:0,width:3,height:'100%',background:art.glow,borderRadius:'14px 0 0 14px'}}/>}
              <div style={{paddingLeft:done?10:0}}>
                <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',gap:8,marginBottom:4}}>
                  <div style={{fontSize:13,fontWeight:600,color:'var(--text1)',letterSpacing:'-0.01em',lineHeight:1.3,flex:1}}>{lesson.title}</div>
                  <div style={{display:'flex',gap:5,flexShrink:0,marginTop:1}}>
                    {starred&&<span style={{color:'#FFD700',fontSize:11}}>⭐</span>}
                    {done&&<span style={{color:art.glow,fontSize:11}}><CheckIcon size={12}/></span>}
                    {hasReflection&&<span style={{color:'var(--text3)',fontSize:10}}>✍️</span>}
                  </div>
                </div>
                <div style={{fontSize:11.5,color:'var(--text3)',fontStyle:'italic',lineHeight:1.4}}>"{lesson.hook}"</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── JOURNAL VIEW ──────────────────────────────────────────────────────────────
function JournalView({state,onBack,onSelectLesson}){
  const [filter,setFilter]=useState('all');

  const entries=useMemo(()=>{
    const all=[];
    TRACKS.forEach(track=>{
      track.lessons.forEach(lesson=>{
        const ref=state.reflections?.[lesson.id];
        if(ref?.text) all.push({lesson,track,reflection:ref});
      });
    });
    all.sort((a,b)=>(b.reflection.timestamp||0)-(a.reflection.timestamp||0));
    if(filter==='all') return all;
    return all.filter(e=>e.track.id===filter);
  },[state.reflections,filter]);

  const totalDone=Object.values(state.done).filter(Boolean).length;
  const streakCurrent=state.streak?.current||0;
  const streakBest=state.streak?.best||0;

  return(
    <div className="fade-in" style={{minHeight:'100vh',background:'var(--bg)'}}>
      {/* Header */}
      <div style={{padding:'20px 20px 0',display:'flex',alignItems:'center',gap:12}}>
        <button onClick={onBack} style={{width:38,height:38,borderRadius:10,background:'var(--surface)',border:'1px solid var(--border2)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text2)'}}><BackIcon size={17}/></button>
        <div style={{fontFamily:'var(--serif)',fontSize:22,color:'var(--text1)',letterSpacing:'-0.02em',fontStyle:'italic'}}>Learning Journal</div>
      </div>

      {/* Stats row */}
      <div style={{padding:'16px 20px 0',display:'flex',gap:8}}>
        <div style={{flex:1,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,padding:'12px',textAlign:'center'}}>
          <div style={{fontFamily:'var(--serif)',fontSize:24,color:'var(--text1)'}}>{entries.length}</div>
          <div style={{fontSize:10,color:'var(--text3)',marginTop:2,letterSpacing:'0.06em',textTransform:'uppercase'}}>Reflections</div>
        </div>
        <div style={{flex:1,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:12,padding:'12px',textAlign:'center'}}>
          <div style={{fontFamily:'var(--serif)',fontSize:24,color:'var(--text1)'}}>{totalDone}</div>
          <div style={{fontSize:10,color:'var(--text3)',marginTop:2,letterSpacing:'0.06em',textTransform:'uppercase'}}>Lessons Done</div>
        </div>
        <div style={{flex:1,background:'linear-gradient(135deg,#FF6B2B15,#FF8C0015)',border:'1px solid #FF6B2B30',borderRadius:12,padding:'12px',textAlign:'center'}}>
          <div style={{fontFamily:'var(--serif)',fontSize:24,color:'#FF8C00'}}>🔥{streakCurrent}</div>
          <div style={{fontSize:10,color:'var(--text3)',marginTop:2,letterSpacing:'0.06em',textTransform:'uppercase'}}>Day Streak</div>
        </div>
      </div>

      {/* Track filter */}
      <div style={{padding:'14px 20px 0',display:'flex',gap:6,overflowX:'auto',paddingBottom:2}}>
        <button onClick={()=>setFilter('all')} style={{padding:'6px 12px',borderRadius:100,fontSize:11,fontWeight:600,background:filter==='all'?'var(--border2)':'transparent',border:'1px solid var(--border)',color:filter==='all'?'var(--text1)':'var(--text3)',flexShrink:0,transition:'all 0.2s'}}>All Tracks</button>
        {TRACKS.map(track=>{
          const art=TRACK_ART[track.id];
          const count=Object.keys(state.reflections||{}).filter(id=>track.lessons.some(l=>l.id===id&&state.reflections[id]?.text)).length;
          if(!count) return null;
          return(
            <button key={track.id} onClick={()=>setFilter(track.id)} style={{padding:'6px 12px',borderRadius:100,fontSize:11,fontWeight:600,flexShrink:0,background:filter===track.id?art.glow+'22':'transparent',border:`1px solid ${filter===track.id?art.glow+'50':'var(--border)'}`,color:filter===track.id?art.glow:'var(--text3)',transition:'all 0.2s'}}>{track.emoji} {count}</button>
          );
        })}
      </div>

      {/* Entries */}
      <div style={{padding:'16px 20px 48px',display:'flex',flexDirection:'column',gap:10}}>
        {entries.length===0&&(
          <div style={{textAlign:'center',padding:'60px 0',color:'var(--text3)',fontSize:14,lineHeight:1.7,fontStyle:'italic'}}>
            <div style={{fontSize:32,marginBottom:12,opacity:0.4}}>✍️</div>
            Your reflections will appear here.<br/>Complete a lesson and capture your insight.
          </div>
        )}
        {entries.map(({lesson,track,reflection},i)=>{
          const art=TRACK_ART[track.id];
          const date=reflection.timestamp?new Date(reflection.timestamp).toLocaleDateString('en-GB',{day:'numeric',month:'short'}):null;
          return(
            <div key={lesson.id} className={`fade-up d${Math.min(i+1,8)}`}
              onClick={()=>onSelectLesson(lesson,track)}
              style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:16,overflow:'hidden',cursor:'pointer'}}>
              <div style={{height:3,background:`linear-gradient(90deg,${art.glow},${art.glow}00)`}}/>
              <div style={{padding:'14px 16px'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
                  <div style={{fontSize:10,color:art.glow,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase'}}>{track.emoji} {track.name}</div>
                  {date&&<div style={{fontSize:10,color:'var(--text3)'}}>{date}</div>}
                </div>
                <div style={{fontSize:13,fontWeight:600,color:'var(--text1)',marginBottom:6,letterSpacing:'-0.01em'}}>{lesson.title}</div>
                <div style={{fontSize:13,color:'var(--text2)',lineHeight:1.55,fontStyle:'italic'}}>"{reflection.text}"</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

                <div style={{height:2,background:`linear-gradient(90deg,${art.glow},${art.glow}00)`}}/>

// ── REVIEW QUEUE VIEW ─────────────────────────────────────────────────────────
function ReviewView({dueItems,onSelect,onBack}){
  const intervalLabels=['7-day review','30-day review','90-day review'];
  return(
    <div className="fade-in" style={{minHeight:'100vh',background:'var(--bg)'}}>
      <div style={{padding:'20px 20px 0',display:'flex',alignItems:'center',gap:12,marginBottom:4}}>
        <button onClick={onBack} style={{width:38,height:38,borderRadius:10,background:'var(--surface)',border:'1px solid var(--border2)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text2)'}}><BackIcon size={17}/></button>
        <div>
          <div style={{fontFamily:'var(--serif)',fontSize:22,color:'var(--text1)',letterSpacing:'-0.02em',fontStyle:'italic'}}>Review Queue</div>
          <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>Spaced repetition · {dueItems.length} due today</div>

      <div style={{padding:'8px 20px 12px',background:'rgba(99,102,241,0.06)',margin:'12px 20px 0',borderRadius:12,border:'1px solid rgba(99,102,241,0.15)'}}>
        <p style={{fontSize:12.5,color:'var(--text2)',lineHeight:1.6}}>These lessons are surfacing again based on the Ebbinghaus forgetting curve — reviewing at 7, 30, and 90 days after completion dramatically improves long-term retention.</p>
      </div>

      <div style={{padding:'16px 20px 48px',display:'flex',flexDirection:'column',gap:8}}>
        {dueItems.map(({lesson,track,dueLevel},i)=>{
          const art=TRACK_ART[track.id];
          return(
            <div key={lesson.id} onClick={()=>onSelect(lesson,track,true)} className={`fade-up d${Math.min(i+1,8)}`}
              style={{background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,overflow:'hidden',cursor:'pointer',position:'relative'}}>
              <div style={{height:2,background:`linear-gradient(90deg,${art.glow},${art.glow}00)`}}/>
              <div style={{padding:'13px 15px'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:4}}>
                  <div style={{fontSize:10,color:art.glow,fontWeight:700,letterSpacing:'0.08em',textTransform:'uppercase'}}>{track.emoji} {track.name}</div>
                  <div style={{fontSize:10,color:'var(--text3)',background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:100,padding:'2px 8px'}}>{intervalLabels[dueLevel]||'Review'}</div>
                </div>
                <div style={{fontSize:14,fontWeight:600,color:'var(--text1)',marginBottom:3,letterSpacing:'-0.01em'}}>{lesson.title}</div>
                <div style={{fontSize:12,color:'var(--text3)',fontStyle:'italic',lineHeight:1.4}}>"{lesson.hook}"</div>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── TRACK CARD ────────────────────────────────────────────────────────────────
function TrackCard({track,doneCount,total,onNext,onBrowse,delay}){
  const pct=Math.round((doneCount/total)*100);
  const art=TRACK_ART[track.id]||TRACK_ART.conversation;
  return(
    <div className={`fade-up d${delay}`} style={{background:art.bg,borderRadius:18,border:'1px solid rgba(255,255,255,0.07)',overflow:'hidden',position:'relative'}}>
      {/* Top progress line */}
      <div style={{position:'absolute',top:0,left:0,right:0,height:2}}>
        <div style={{height:'100%',width:pct+'%',background:`linear-gradient(90deg,${art.glow},${art.glow}99)`,transition:'width 0.6s'}}/>
      </div>
      {/* SVG art */}
      <div style={{position:'absolute',inset:0,opacity:0.55}}><TrackIllustration trackId={track.id}/></div>
      {/* Content */}
      <div style={{position:'relative',zIndex:2,padding:'16px 16px 14px'}}>
        <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:10}}>
          <div style={{flex:1}}>
            <div style={{fontSize:20,marginBottom:5}}>{track.emoji}</div>
            <div style={{fontSize:14,fontWeight:600,color:'rgba(255,255,255,0.92)',letterSpacing:'-0.01em',lineHeight:1.2,marginBottom:2}}>{track.name}</div>
            <div style={{fontSize:10,color:'rgba(255,255,255,0.3)',letterSpacing:'0.02em'}}>{track.description.split(',')[0]}</div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:5,marginLeft:10}}>
            <div style={{fontSize:11,fontWeight:600,color:'rgba(255,255,255,0.35)',background:'rgba(255,255,255,0.07)',border:'1px solid rgba(255,255,255,0.1)',borderRadius:6,padding:'3px 7px',textAlign:'center'}}>{doneCount}/{total}</div>
          </div>
        </div>
        {/* Progress bar */}
        <div style={{height:3,background:'rgba(255,255,255,0.08)',borderRadius:2,overflow:'hidden',marginBottom:10}}>
          <div style={{height:'100%',width:pct+'%',background:`linear-gradient(90deg,${art.glow},${art.glow}80)`,borderRadius:2,transition:'width 0.6s'}}/>
        </div>
        {/* Action buttons */}
        <div style={{display:'flex',gap:6}}>
          <button onClick={e=>{e.stopPropagation();onNext();}} style={{flex:2,padding:'8px',borderRadius:9,background:art.glow,border:'none',color:'#fff',fontSize:12,fontWeight:600,letterSpacing:'0.01em',boxShadow:`0 4px 16px ${art.glow}30`}}>
            Next Lesson →
          </button>
          <button onClick={e=>{e.stopPropagation();onBrowse();}} style={{flex:1,padding:'8px',borderRadius:9,background:'rgba(255,255,255,0.08)',border:'1px solid rgba(255,255,255,0.12)',color:'rgba(255,255,255,0.6)',fontSize:12,fontWeight:600}}>
            Browse
          </button>
        </div>
      </div>
    </div>
  );
}

// ── HOME ──────────────────────────────────────────────────────────────────────
function Home({state,onOpenLesson,onOpenStarred,onOpenJournal,onOpenReview,onOpenBrowse}){
  const totalDone=Object.values(state.done).filter(Boolean).length;
  const totalLessons=TRACKS.reduce((sum,t)=>sum+t.lessons.length,0);
  const starredCount=Object.values(state.starred||{}).filter(Boolean).length;
  const streakCurrent=state.streak?.current||0;
  const streakBest=state.streak?.best||0;
  const dueReviews=getDueReviews(state);
  const pct=Math.round((totalDone/totalLessons)*100);

  const getNext=(track)=>{
    const undone=track.lessons.filter(l=>!state.done[l.id]);
    return undone.length>0?undone[0]:track.lessons[0];
  };
  const handleSurprise=()=>{
    const all=[];
    TRACKS.forEach(t=>{t.lessons.forEach(l=>{if(!state.done[l.id])all.push({lesson:l,track:t});});});
    if(all.length===0){const t=TRACKS[Math.floor(Math.random()*TRACKS.length)];onOpenLesson(t.lessons[Math.floor(Math.random()*t.lessons.length)],t);}
    else{const p=all[Math.floor(Math.random()*all.length)];onOpenLesson(p.lesson,p.track);}
  };

  return(
    <div style={{minHeight:'100vh',background:'var(--bg)',paddingBottom:40}}>
      {/* Ambient glow */}
      <div style={{position:'fixed',top:-80,left:'50%',transform:'translateX(-50%)',width:500,height:400,background:'radial-gradient(ellipse,rgba(99,102,241,0.06) 0%,transparent 70%)',pointerEvents:'none',zIndex:0}}/>

      <div style={{position:'relative',zIndex:1}}>
        {/* Header */}
        <div className="fade-up d1" style={{padding:'52px 22px 0'}}>
          <div style={{display:'flex',alignItems:'flex-start',justifyContent:'space-between',marginBottom:20}}>
            <div>
              <div style={{fontFamily:'var(--serif)',fontSize:30,lineHeight:1.1,color:'var(--text1)',letterSpacing:'-0.02em',marginBottom:6}}>Daily Training</div>
              <div style={{fontSize:12,color:'var(--text3)'}}>{totalLessons} lessons · 7 tracks</div>
            </div>
            <div style={{display:'flex',gap:7}}>
              {starredCount>0&&(
                <button onClick={onOpenStarred} style={{width:40,height:40,borderRadius:10,background:'rgba(255,215,0,0.1)',border:'1px solid rgba(255,215,0,0.25)',display:'flex',alignItems:'center',justifyContent:'center',color:'#FFD700',position:'relative'}}>
                  <StarIcon filled size={16}/>
                  <div style={{position:'absolute',top:-4,right:-4,background:'#FFD700',color:'#000',borderRadius:'50%',width:16,height:16,fontSize:9,fontWeight:700,display:'flex',alignItems:'center',justifyContent:'center'}}>{starredCount}</div>
                </button>
              )}
              <button onClick={onOpenJournal} style={{width:40,height:40,borderRadius:10,background:'var(--surface)',border:'1px solid var(--border2)',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--text3)'}}>
                <BookIcon size={16}/>
              </button>
            </div>
          </div>

          {/* Streak + Stats */}
          <div style={{display:'flex',gap:8,marginBottom:16}}>
            <div style={{flex:1,background:'linear-gradient(135deg,rgba(255,107,43,0.12),rgba(255,140,0,0.08))',border:'1px solid rgba(255,107,43,0.2)',borderRadius:14,padding:'12px 14px'}}>
              <div style={{display:'flex',alignItems:'center',gap:6,marginBottom:4}}>
                <span style={{fontSize:18}}>🔥</span>
                <span style={{fontFamily:'var(--serif)',fontSize:26,color:'#FF8C00'}}>{streakCurrent}</span>
              </div>
              <div style={{fontSize:10,color:'var(--text3)',letterSpacing:'0.06em',textTransform:'uppercase'}}>Day Streak</div>
              {streakBest>0&&<div style={{fontSize:10,color:'rgba(255,107,43,0.5)',marginTop:2}}>Best: {streakBest}</div>}
            </div>
            <div style={{flex:1,background:'var(--surface)',border:'1px solid var(--border)',borderRadius:14,padding:'12px 14px'}}>
              <div style={{fontFamily:'var(--serif)',fontSize:26,color:'var(--text1)',marginBottom:4}}>{totalDone}</div>
              <div style={{fontSize:10,color:'var(--text3)',letterSpacing:'0.06em',textTransform:'uppercase'}}>Completed</div>
              <div style={{fontSize:10,color:'var(--text3)',marginTop:2}}>{pct}% done</div>
            </div>
            {dueReviews.length>0&&(
              <button onClick={onOpenReview} style={{flex:1,background:'linear-gradient(135deg,rgba(99,102,241,0.15),rgba(139,92,246,0.1))',border:'1px solid rgba(99,102,241,0.25)',borderRadius:14,padding:'12px 14px',textAlign:'left',cursor:'pointer'}}>
                <div style={{fontFamily:'var(--serif)',fontSize:26,color:'#818CF8',marginBottom:4}}>{dueReviews.length}</div>
                <div style={{fontSize:10,color:'var(--text3)',letterSpacing:'0.06em',textTransform:'uppercase'}}>Due Review</div>
                <div style={{fontSize:10,color:'rgba(99,102,241,0.5)',marginTop:2}}>Tap to review</div>
              </button>
            )}
          </div>

          {/* Global progress */}
          {totalDone>0&&(
            <div style={{marginBottom:4}}>
              <div style={{height:3,background:'var(--surface2)',borderRadius:2,overflow:'hidden'}}>
                <div style={{height:'100%',width:pct+'%',background:'linear-gradient(90deg,#6366F1,#8B5CF6,#06B6D4)',borderRadius:2,transition:'width 0.8s'}}/>
              </div>
            </div>
          )}
        </div>

        {/* Surprise Me */}
        <div className="fade-up d2" style={{padding:'14px 22px 0'}}>
          <button onClick={handleSurprise} style={{width:'100%',padding:'14px',borderRadius:16,background:'linear-gradient(135deg,#1e1b4b,#312e81)',border:'1px solid rgba(99,102,241,0.3)',color:'#fff',fontSize:14,fontWeight:600,display:'flex',alignItems:'center',justifyContent:'center',gap:10,boxShadow:'0 8px 28px rgba(99,102,241,0.18)',letterSpacing:'0.01em'}}>
            <ShuffleIcon size={16}/>Surprise Me
          </button>
        </div>

        {/* Tracks label */}
        <div className="fade-up d3" style={{padding:'20px 22px 8px'}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:'0.16em',textTransform:'uppercase',color:'var(--text3)'}}>Your Tracks</div>
        </div>

        {/* Track cards */}
        <div style={{padding:'0 22px',display:'flex',flexDirection:'column',gap:9}}>
          {TRACKS.map((track,i)=>(
            <TrackCard
              key={track.id}
              track={track}
              doneCount={track.lessons.filter(l=>state.done[l.id]).length}
              total={track.lessons.length}
              onNext={()=>onOpenLesson(getNext(track),track)}
              onBrowse={()=>onOpenBrowse(track)}
              delay={Math.min(i+4,9)}
            />
          ))}
        </div>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const [state,setState]=useState(()=>loadState());
  const [view,setView]=useState('home');
  const [activeLesson,setActiveLesson]=useState(null);
  const [activeTrack,setActiveTrack]=useState(null);
  const [isReview,setIsReview]=useState(false);
  const [browseTrack,setBrowseTrack]=useState(null);

  useEffect(()=>{ saveState(state); },[state]);

  const openLesson=(lesson,track,review=false)=>{
    setActiveLesson(lesson);setActiveTrack(track);setIsReview(review);setView('lesson');
  };

  const toggleDone=(id)=>{
    setState(s=>{
      const nowDone=!s.done[id];
      const newDone={...s.done,[id]:nowDone?Date.now():null};
      // Update streak when completing
      const newStreak=nowDone?updateStreak(s):s.streak;
      return{...s,done:newDone,streak:newStreak};
    });
  };

  const toggleStar=(id)=>setState(s=>({...s,starred:{...s.starred,[id]:!s.starred[id]}}));

  const saveReflection=(lessonId,text)=>{
    setState(s=>({
      ...s,
      reflections:{
        ...s.reflections,
        [lessonId]:{text,timestamp:Date.now()}
      }
    }));
  };

  const markReviewed=(lessonId)=>{
    setState(s=>({
      ...s,
      reviews:{
        ...s.reviews,
        [lessonId]:[...(s.reviews[lessonId]||[]),Date.now()]
      },
      streak:updateStreak(s)
    }));
  };

  const dueReviews=getDueReviews(state);

  if(view==='lesson'&&activeLesson){
    return(
      <LessonView
        lesson={activeLesson} track={activeTrack}
        onBack={()=>{if(isReview)markReviewed(activeLesson.id);setView('home');}}
        isDone={!!state.done[activeLesson.id]}
        isStarred={!!state.starred[activeLesson.id]}
        onToggleDone={()=>toggleDone(activeLesson.id)}
        onToggleStar={()=>toggleStar(activeLesson.id)}
        onSaveReflection={saveReflection}
        existingReflection={state.reflections?.[activeLesson.id]}
        isReview={isReview}
      />
    );
  }
  if(view==='starred') return <StarredView state={state} onSelect={(l,t)=>openLesson(l,t)} onBack={()=>setView('home')}/>;
  if(view==='journal') return <JournalView state={state} onBack={()=>setView('home')} onSelectLesson={(l,t)=>openLesson(l,t)}/>;
  if(view==='review') return <ReviewView dueItems={dueReviews} onSelect={(l,t,r)=>openLesson(l,t,r)} onBack={()=>setView('home')}/>;
  if(view==='browse'&&browseTrack) return <BrowseView track={browseTrack} state={state} onSelect={(l)=>openLesson(l,browseTrack)} onBack={()=>setView('home')}/>;

  return(
    <Home
      state={state}
      onOpenLesson={openLesson}
      onOpenStarred={()=>setView('starred')}
      onOpenJournal={()=>setView('journal')}
      onOpenReview={()=>setView('review')}
      onOpenBrowse={(track)=>{setBrowseTrack(track);setView('browse');}}
    />
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
